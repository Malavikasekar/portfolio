<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Weather App UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="screen-container">
            
            <!-- Screen 1: Splash -->
            <div class="screen splash-screen active" id="screen-splash">
                <div class="splash-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/3222/3222800.png" alt="Weather App Logo">
                </div>
            </div>

            <!-- Screen 2: Search -->
            <div class="screen search-screen hidden" id="screen-search">
                <div class="search-header">
                    <div class="search-bar">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a0aab5" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search for a city..." value="lon">
                        <button class="clear-btn" aria-label="Clear">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                
                <div class="search-results-container">
                    <div class="search-results">
                        <div class="result-item" onclick="navigateTo('screen-weather-london')">
                            <div class="result-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </div>
                            <div class="result-text">
                                <h3>London</h3>
                                <p>City of London, Greater London, Uni...</p>
                            </div>
                        </div>
                        <div class="result-item" onclick="navigateTo('screen-weather-london')">
                            <div class="result-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </div>
                            <div class="result-text">
                                <h3>Londrina</h3>
                                <p>Parana, Brazil</p>
                            </div>
                        </div>
                        <div class="result-item" onclick="navigateTo('screen-weather-london')">
                            <div class="result-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </div>
                            <div class="result-text">
                                <h3>Loni</h3>
                                <p>Uttar Pradesh, India</p>
                            </div>
                        </div>
                        <div class="result-item" onclick="navigateTo('screen-weather-london')">
                            <div class="result-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </div>
                            <div class="result-text">
                                <h3>Long Xuyen</h3>
                                <p>Vietnam</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Screen 3: Weather Details (London) -->
            <div class="screen weather-screen hidden" id="screen-weather-london">
                
                <div class="search-bar-mock" onclick="navigateBack('screen-search')">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span class="mock-text">Search for a city...</span>
                </div>

                <div class="weather-card">
                    <div class="weather-header">
                        <h1 class="city-name">London</h1>
                        <p class="date-time">Sun, Jul 26, 2026 | 04:24 pm</p>
                    </div>
                    
                    <div class="weather-main-icon">
                        <img src="https://cdn-icons-png.flaticon.com/512/1146/1146860.png" alt="Rainy">
                    </div>
                    
                    <h2 class="temperature">22°C</h2>
                    <p class="condition">Patchy rain nearby</p>
                    
                    <div class="weather-details-card">
                        <div class="detail-item">
                            <span class="detail-label">Feels Like</span>
                            <span class="detail-value">14°C</span>
                        </div>
                        <div class="detail-divider"></div>
                        <div class="detail-item">
                            <span class="detail-label">Humidity</span>
                            <span class="detail-value">60%</span>
                        </div>
                        <div class="detail-divider"></div>
                        <div class="detail-item">
                            <span class="detail-label">Wind</span>
                            <span class="detail-value">19.4 km/h</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
